name: Release

# Triggered by pushing a tag like v1.0.0. Builds the debug APK, the release APK/AAB (signed
# only if the repository's signing secrets are configured — see below), generates checksums,
# and attaches everything to a GitHub Release for the tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # Secrets cannot be referenced directly inside a step's `if:` condition, so the presence
    # check is assigned to a job-level env var here and read back from `env.` below.
    env:
      HAS_SIGNING_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Decode release keystore
        # Signing is entirely optional. Without ANDROID_KEYSTORE_BASE64 configured as a
        # repository secret, this step is skipped and the build below produces an unsigned
        # release APK/AAB — which is a real artifact (it still exercises R8 and resource
        # shrinking) but cannot be installed until it is signed by someone holding a key.
        # See CONTRIBUTING.md for the full signing setup.
        if: ${{ env.HAS_SIGNING_SECRET == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK and AAB
        env:
          DROIDPILOT_KEYSTORE: ${{ env.keystore_path }}
          DROIDPILOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DROIDPILOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DROIDPILOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Stage artifacts and checksums
        id: stage
        run: |
          mkdir -p staging
          cp app/build/outputs/apk/debug/app-debug.apk staging/DroidPilot-debug.apk
          release_apk=$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)
          if [[ "$release_apk" == *unsigned* ]]; then
            cp "$release_apk" staging/DroidPilot-release-UNSIGNED.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            cp "$release_apk" staging/DroidPilot-release.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          cp app/build/outputs/bundle/release/app-release.aab staging/DroidPilot-release.aab
          ( cd staging && sha256sum *.apk *.aab > SHA256SUMS.txt )
          cat staging/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: android/staging/*
          generate_release_notes: true
          draft: true
          body: |
            ${{ steps.stage.outputs.signed == 'true' && 'The release APK/AAB in this release are signed with the repository''s configured release key.' || '**The release APK in this release is UNSIGNED** (no ANDROID_KEYSTORE_BASE64 secret is configured for this repository) — it cannot be installed as-is. It still exercises R8 and resource shrinking. Sign it yourself, or configure release signing secrets and re-run this workflow. See CONTRIBUTING.md.' }}

            SHA-256 checksums are in `SHA256SUMS.txt`, attached to this release.
