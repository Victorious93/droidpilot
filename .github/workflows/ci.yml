name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref; there is no value in
# finishing a build for a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android — build, test, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        # `lint.abortOnError` is true in the build script, so a lint error fails here.
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        # No signing credentials are configured in CI, so this produces an unsigned APK.
        # It still exercises R8 and resource shrinking, which is where release-only
        # breakage lives — a missing keep rule strips the serializers and every command
        # fails at runtime while debug builds stay green.
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droidpilot-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        # Reports are most valuable precisely when the run failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
          retention-days: 14

  mcp-server:
    name: MCP server — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Includes the cross-implementation vector shared with the Kotlin suite: both
        # sides assert the same ciphertext for a fixed (secret, salt, plaintext), so a
        # change that breaks wire compatibility fails here rather than in the field.
        run: npm test

      - name: Build
        run: npm run build
