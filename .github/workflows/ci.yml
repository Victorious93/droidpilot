name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref; there is no value in
# finishing a build for a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android — build, test, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        # `lint.abortOnError` is true in the build script, so a lint error fails here.
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        # No signing credentials are configured in CI, so this produces an unsigned APK.
        # It still exercises R8 and resource shrinking, which is where release-only
        # breakage lives — a missing keep rule strips the serializers and every command
        # fails at runtime while debug builds stay green.
        run: ./gradlew assembleRelease --stacktrace

      - name: Bundle release AAB
        # Same unsigned caveat as the release APK above — this is what a Play Console
        # upload needs, exercised on every push rather than only at release time.
        run: ./gradlew bundleRelease --stacktrace

      - name: Stage artifacts under clear, stable names
        # The Gradle output paths encode the variant (debug/release) rather than the
        # project name, and change shape between APK and AAB. Staging them under one
        # directory with the names this project documents keeps CI's uploaded artifact
        # names matching what a person downloading them would expect.
        run: |
          mkdir -p staging
          cp app/build/outputs/apk/debug/app-debug.apk staging/DroidPilot-debug.apk
          # Gradle names the release APK app-release.apk when it is signed and
          # app-release-unsigned.apk when it is not; CI has no signing credentials, but a
          # fork or a future run with them configured should still be staged correctly.
          release_apk=$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)
          cp "$release_apk" staging/DroidPilot-release.apk
          cp app/build/outputs/bundle/release/app-release.aab staging/DroidPilot-release.aab
          ( cd staging && sha256sum *.apk *.aab > SHA256SUMS.txt )
          cat staging/SHA256SUMS.txt

      - name: Upload APKs and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droidpilot-apks
          path: android/staging/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        # Reports are most valuable precisely when the run failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
          retention-days: 14

  instrumented:
    name: Android — instrumented tests (emulator)
    runs-on: ubuntu-latest
    # The emulator needs time to boot under CI load; the cap stops a hung boot from
    # occupying a runner for the full six-hour default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's ubuntu runners expose /dev/kvm, but only to the `kvm` group. Without this
      # the emulator falls back to software emulation and is far too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 is the project's minSdk — the oldest release that has to work.
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          # The suite enables the Accessibility service itself, through UiAutomation's shell
          # privileges, rather than relying on a step here — a later reinstall would undo a
          # setting written outside the test process.
          # The action runs `script` from the repository root, and gradlew lives in android/.
          script: cd android && ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14

  mcp-server:
    name: MCP server — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Includes the cross-implementation vector shared with the Kotlin suite: both
        # sides assert the same ciphertext for a fixed (secret, salt, plaintext), so a
        # change that breaks wire compatibility fails here rather than in the field.
        run: npm test

      - name: Build
        run: npm run build
